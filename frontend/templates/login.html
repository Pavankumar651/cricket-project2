<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Ground Cricket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0f0d;
            color: #f0fdf4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #15201a;
            border: 1px solid #1f2d24;
            border-radius: 16px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .login-logo { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 3px; color: #22c55e; text-align: center; margin-bottom: 6px; }
        .login-sub  { text-align: center; color: #4ade80; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 32px; }
        .form-label { display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #4ade80; margin-bottom: 8px; font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        .form-control {
            width: 100%;
            background: #0a0f0d;
            border: 1px solid #1f2d24;
            border-radius: 8px;
            color: #f0fdf4;
            padding: 12px 16px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-control:focus { outline: none; border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.1); }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #22c55e;
            color: #0a0f0d;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-login:hover { background: #16a34a; }
        .error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #4b5563; font-size: 13px; text-decoration: none; }
        .back-link:hover { color: #22c55e; }
        .icon { text-align: center; font-size: 40px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="icon">🏏</div>
        <div class="login-logo">ADMIN LOGIN</div>
        <div class="login-sub">Ground Cricket Analytics</div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/auth/login">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">🔐 Login to Admin Panel</button>
        </form>

        <a href="/" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
