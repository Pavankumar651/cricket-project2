<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cricket Analytics{% endblock %} | Ground Cricket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- Navigation -->
<nav class="navbar">
    <div class="nav-container">
        <a href="/" class="nav-brand">
            <div class="brand-icon">🏏</div>
            <div>
                <div class="brand-name">GROUND CRICKET</div>
                <div class="brand-sub">Daily Match Analytics</div>
            </div>
        </a>
        <ul class="nav-links">
            <li><a href="/" class="nav-link {% if request.endpoint == 'main.index' %}active{% endif %}">
                <i class="fas fa-home"></i> Home
            </a></li>
            <li><a href="/players" class="nav-link {% if request.endpoint == 'main.players_page' %}active{% endif %}">
                <i class="fas fa-users"></i> Players
            </a></li>
            <li><a href="/matches" class="nav-link {% if request.endpoint == 'main.matches_page' %}active{% endif %}">
                <i class="fas fa-cricket-bat-ball"></i> Matches
            </a></li>
            <li><a href="/leaderboard" class="nav-link {% if 'leaderboard' in request.endpoint %}active{% endif %}">
                <i class="fas fa-trophy"></i> Leaderboard
            </a></li>
            <li><a href="/admin" class="nav-link admin-link">
                <i class="fas fa-shield-halved"></i> Admin
            </a></li>
        </ul>
        <button class="nav-toggle" id="navToggle">
            <span></span><span></span><span></span>
        </button>
    </div>
</nav>

<!-- Main Content -->
<main class="main-content">
    {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="footer">
    <div class="footer-inner">
        <div class="footer-brand">🏏 Ground Cricket Analytics</div>
        <div class="footer-text">Daily Local Cricket — Scoring & Analytics System</div>
    </div>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
