{% extends "base.html" %}
{% block title %}All Players{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <div class="page-title">ALL <span>PLAYERS</span></div>
        <div class="page-subtitle">15 Registered Players — Career Stats</div>
    </div>

    <div class="players-grid" id="playersGrid">
        {% for i in range(15) %}
        <div class="skeleton" style="height:200px; border-radius:12px;"></div>
        {% endfor %}
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadPlayers() {
    const resp = await fetch('/api/players/');
    const players = await resp.json();
    document.getElementById('playersGrid').innerHTML = players.map(p => `
        <a href="/player/${p.id}" class="player-card">
            <div class="player-avatar">${p.name[0]}</div>
            <div class="player-name">${p.name}</div>
            <div class="player-role-badge">${p.role}</div>
            <div class="player-stats-mini">
                <div class="stat-mini">
                    <span class="stat-mini-label">Runs</span>
                    <span class="stat-mini-value">${p.career?.runs || 0}</span>
                </div>
                <div class="stat-mini">
                    <span class="stat-mini-label">Wkts</span>
                    <span class="stat-mini-value">${p.career?.wickets || 0}</span>
                </div>
                <div class="stat-mini">
                    <span class="stat-mini-label">Matches</span>
                    <span class="stat-mini-value">${p.career?.matches || 0}</span>
                </div>
                <div class="stat-mini">
                    <span class="stat-mini-label">HS</span>
                    <span class="stat-mini-value">${p.career?.highest || 0}</span>
                </div>
            </div>
        </a>
    `).join('');
}
loadPlayers();
</script>
{% endblock %}
